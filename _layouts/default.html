    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"

    <script src="{{site.baseurl}}/assets/js/darkmode.js" defer></script>
    <script src="{{site.baseurl}}/assets/js/lazysizes.min.js" async=""></script>

    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js" defer></script>

    <style>
        /* Mermaid High-Contrast Styling (DarkReader-Proof) */
        .mermaid {
            background-color: transparent !important;
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        /* Force SVG elements to keep their colors regardless of DarkReader */
        .mermaid svg {
            filter: none !important;
            max-width: 100%;
        }

        .mermaid .node rect,
        .mermaid .node circle,
        .mermaid .node polygon,
        .mermaid .node path {
            stroke-width: 2px !important;
        }

        /* Ensure labels are ALWAYS white and bold on top of our nodes */
        .mermaid .node text,
        .mermaid .node tspan,
        .mermaid .label text,
        .mermaid div.label {
            fill: #ffffff !important;
            color: #ffffff !important;
            font-weight: 700 !important;
            font-family: inherit !important;
        }

        /* Edge labels (text between boxes) need to be visible too */
        .mermaid .edgeLabel text {
            fill: inherit !important;
            color: inherit !important;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof mermaid !== 'undefined') {
                console.log('Mermaid: Initializing...');

                const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const themeVariables = {
                    'primaryColor': '#00a4f5',
                    'primaryTextColor': '#ffffff',
                    'primaryBorderColor': isDarkMode ? '#ffffff' : '#007bb8',
                    'lineColor': isDarkMode ? '#ffffff' : '#212529',
                    'secondaryColor': '#7832e2',
                    'secondaryTextColor': '#ffffff',
                    'tertiaryColor': 'transparent',
                    'nodeBorder': isDarkMode ? '#ffffff' : '#007bb8',
                    'clusterBkg': isDarkMode ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.02)',
                    'clusterBorder': isDarkMode ? '#007bb8' : '#00a4f5',
                    'titleColor': isDarkMode ? '#ffffff' : '#212529',
                    'edgeLabelBackground': isDarkMode ? '#212529' : '#ffffff',
                    'fontFamily': '"Segoe UI", Arial, sans-serif'
                };

                try {
                    mermaid.initialize({
                        startOnLoad: false,
                        theme: 'base',
                        themeVariables: themeVariables,
                        securityLevel: 'loose',
                        maxTextSize: 100000,
                        flowchart: {
                            useMaxWidth: true,
                            htmlLabels: true,
                            curve: 'basis'
                        }
                    });

                    // Find all mermaid code blocks and convert them
                    const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
                    console.log('Mermaid: Found ' + mermaidBlocks.length + ' blocks.');

                    const nodes = [];
                    mermaidBlocks.forEach((block, index) => {
                        const pre = block.parentElement;
                        const div = document.createElement('div');
                        div.className = 'mermaid';
                        div.id = 'mermaid-render-' + index;
                        div.setAttribute('data-darkreader-ignore', '');
                        // Get clean text content, handling potential extra spaces
                        div.textContent = block.textContent.trim();
                        pre.replaceWith(div);
                        nodes.push(div);
                    });

                    if (nodes.length > 0) {
                        mermaid.run({
                            nodes: nodes
                        }).then(() => {
                            console.log('Mermaid: Rendering complete.');
                        }).catch((err) => {
                            console.error('Mermaid: Error during run:', err);
                        });
                    }
                } catch (err) {
                    console.error('Mermaid: Initialization failed:', err);
                }
            } else {
                console.error('Mermaid: Library not loaded!');
            }
        });
    </script>

    {% if jekyll.environment == 'production' %}
    {% include tracking-header.html %}
    {% endif %}
</head>

<body class="{% if page.url == " /" %} homefirstpage {% endif %}">

    <!-- Navbar -->
    <nav id="MagicMenu" class="topnav navbar navbar-expand-lg navbar-light bg-white fixed-top">

            <button class="navbar-toggler collapsed" type="button" data-toggle="collapse" data-target="#navbarColor02"
                aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">

            </button>
            <div class="navbar-collapse collapse" id="navbarColor02" style="">
                <ul class="navbar-nav mr-auto d-flex align-items-center">
                    {% include menu-header.html %}
                </ul>
                <ul class="navbar-nav ml-auto d-flex align-items-center">
                    <!-- Search Form -->
                    <li class="nav-item position-relative">
                        <input type="text" id="search-input" class="form-control" placeholder="Search..."
                            style="min-width: 200px;">
                        <div id="results-container" class="position-absolute bg-white shadow rounded p-2"

                    </li>
                </ul>
            </div>

    <!-- Search Results Container is now dynamically handled -->

    <!-- Content -->
    <main role="main" class="site-content">

    <!-- Bootstrap Modified -->
    <link rel="stylesheet" href="{{site.baseurl}}/assets/css/main.css">

    <!-- Theme Stylesheet -->
    <link rel="stylesheet" href="{{site.baseurl}}/assets/css/theme.css">

    <script src="{{site.baseurl}}/assets/js/lazysizes.min.js" async=""></script>

    <!-- Footer -->

        <div class="container">
            <div class="row align-items-center justify-content-between">
                <div>
                    <span class="navbar-brand mr-2 mb-0"><strong>GeekyPanda </strong></span>
                    <span>Copyright © GeekyPanda
                        <script>document.write(new Date().getFullYear())</script>.
                    </span>

                    <!--  Github Repo Star Btn-->
                    <a class="text-dark ml-1" target="_blank" href="https://github.com/upendra-bajpai">
                        <i class="fab fa-github"></i> Follow me on Github</a>

                </div>

                <div>
                    {% include social_affi.html %}
                </div>
                <!--  <div>
                Made with <a target="_blank" class="text-dark font-weight-bold" href="https://www.wowthemes.net/mundana-jekyll-theme/"> Mundana Jekyll Theme </a> by <a class="text-dark" target="_blank" href="https://www.wowthemes.net">WowThemes</a>.
            </div> -->
            </div>
        </div>
    </footer>



    <!-- Simple Jekyll Search -->
    <script src="{{site.baseurl}}/assets/js/simple-jekyll-search.min.js"></script>
    <script>
        var sjs = SimpleJekyllSearch({
            searchInput: document.getElementById('search-input'),
            resultsContainer: document.getElementById('results-container'),
            json: '{{site.baseurl}}/search.json',
            searchResultTemplate: '<div class="p-2 border-bottom"><a href="{url}" class="d-block text-dark font-weight-bold">{title}</a><span class="small text-muted">{date}</span></div>',
            noResultsText: '<div class="p-2">No results found</div>',
            limit: 10,
            fuzzy: false
        })

        // Toggle results container visibility
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results-container');

        searchInput.addEventListener('input', function () {
            if (this.value.length > 0) {
                resultsContainer.style.display = 'block';
            } else {
                resultsContainer.style.display = 'none';
            }
        });

        document.addEventListener('click', function (e) {
            if (!searchInput.contains(e.target) && !resultsContainer.contains(e.target)) {
                resultsContainer.style.display = 'none';
            }
        });
    </script>
</body>

</html>
