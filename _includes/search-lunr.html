<script src="{{site.baseurl}}/assets/js/lunr.js"></script>

<script>
console.log('Search script starting...');

// Load essential content for search (limited for performance)
{% assign counter = 0 %}
{% assign page_limit = 50 %}
var documents = [{% for page in site.pages limit:page_limit %}{% unless page.url contains '.xml' or page.url contains 'assets' or page.url contains '404' %}
    {
      "id": {{ counter }},
      "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
      "title": "{{ page.title | escape }}",
      "body": "{{ page.content | markdownify | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' | escape }}"
    }{% assign counter = counter | plus: 1 %}{% unless forloop.last %},{% endunless %}{% endunless %}{% endfor %}{% for page in site.posts limit:page_limit %}
    {
      "id": {{ counter }},
      "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
      "title": "{{ page.title | escape }}",
      "body": "{{ page.date | date: "%Y/%m/%d" }} - {{ page.content | markdownify | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' | escape }}"
    }{% assign counter = counter | plus: 1 %}{% unless forloop.last %},{% endunless %}{% endfor %}];

console.log('Loaded', documents.length, 'documents for search');

// Create search index
var idx = lunr(function () {
    this.ref('id');
    this.field('title');
    this.field('body');
    documents.forEach(function (doc) {
        this.add(doc);
    }, this);
});

console.log('Search index created successfully');

$(function() {
    console.log('jQuery ready, setting up search handlers');
    
    // Close modal when clicking X button
    $("#lunrsearchresults").on('click', '#btnx', function () {
        $('#lunrsearchresults').hide(1000);
        $("body").removeClass("modal-open");
        console.log('Modal closed');
    });
});

function lunr_search(term) {
    console.log('Searching for:', term);
    
    if (!term || term.trim() === '') {
        console.log('Empty search term, returning');
        return false;
    }
    
    // Show search modal
    $('#lunrsearchresults').show(1000);
    $("body").addClass("modal-open");
    
    document.getElementById('lunrsearchresults').innerHTML = 
        '<div id="resultsmodal" class="modal fade show d-block" tabindex="-1" role="dialog">' +
        '<div class="modal-dialog shadow-lg" role="document">' +
        '<div class="modal-content">' +
        '<div class="modal-header" id="modtit">' +
        '<button type="button" class="close" id="btnx" data-dismiss="modal" aria-label="Close">&times;</button>' +
        '</div>' +
        '<div class="modal-body">' +
        '<ul class="mb-0"></ul>' +
        '</div>' +
        '<div class="modal-footer">' +
        '<button type="button" class="btn btn-secondary btn-sm" id="btnx" data-dismiss="modal">Close</button>' +
        '</div>' +
        '</div>' +
        '</div>';
    
    // Add search title
    document.getElementById('modtit').innerHTML = 
        "<h5 class='modal-title'>Search results for '" + term + "'</h5>" + 
        document.getElementById('modtit').innerHTML;
    
    // Perform search
    var results = idx.search(term);
    console.log('Found', results.length, 'results');
    
    if (results.length > 0) {
        var resultsHtml = '';
        for (var i = 0; i < results.length; i++) {
            var ref = results[i]['ref'];
            var doc = documents[ref];
            
            if (doc) {
                var url = doc.url;
                var title = doc.title || 'Untitled';
                var body = doc.body || '';
                var snippet = body.substring(0, 160) + (body.length > 160 ? '...' : '');
                
                resultsHtml += '<li class="lunrsearchresult">' +
                    '<a href="' + url + '">' +
                    '<span class="title">' + title + '</span><br/>' +
                    '<small><span class="body">' + snippet + '</span><br/>' +
                    '<span class="url">' + url + '</span></small>' +
                    '</a></li>';
            }
        }
        document.querySelectorAll('#lunrsearchresults ul')[0].innerHTML = resultsHtml;
    } else {
        document.querySelectorAll('#lunrsearchresults ul')[0].innerHTML = 
            '<li class="lunrsearchresult">Sorry, no results found. Close & try a different search!</li>';
    }
    
    return false;
}

// Setup form handler
$(document).ready(function() {
    console.log('Setting up form submit handler');
    $('.bd-search').on('submit', function(e) {
        e.preventDefault();
        console.log('Form submit prevented');
        var searchTerm = $('#lunrsearch').val();
        return lunr_search(searchTerm);
    });
    
    // Also handle enter key
    $('#lunrsearch').on('keypress', function(e) {
        if (e.which === 13) { // Enter key
            e.preventDefault();
            var searchTerm = $(this).val();
            console.log('Enter key pressed, searching for:', searchTerm);
            return lunr_search(searchTerm);
        }
    });
    
    console.log('Search setup complete');
});
</script>

<style>
    .lunrsearchresult .title {color: #03a87c;}
    .lunrsearchresult .url {color: silver;}
    .lunrsearchresult a {display: block; color: #777; padding: 8px 0; border-bottom: 1px solid #eee;}
    .lunrsearchresult a:hover, .lunrsearchresult a:focus {text-decoration: none; background-color: #f8f9fa;}
    .lunrsearchresult a:hover .title {text-decoration: underline;}
</style>

<form class="bd-search hidden-sm-down">
    <input type="text" class="form-control text-small" id="lunrsearch" name="q" value="" placeholder="Type keyword and enter...">
</form>
